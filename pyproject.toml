[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yn360-ble"
version = "0.3.0"
description = "Control Yongnuo YN360 / YN360 III (Pro) LED lights over Bluetooth LE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hudson Brendon", email = "contato.hudsonbrendon@gmail.com" }]
keywords = ["yongnuo", "yn360", "bluetooth", "ble", "led", "light", "home-assistant"]
dependencies = ["bleak>=0.21"]

[project.urls]
Homepage = "https://github.com/hudsonbrendon/yn360-ble"
Issues = "https://github.com/hudsonbrendon/yn360-ble/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
yn360 = "yn360.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yn360"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
